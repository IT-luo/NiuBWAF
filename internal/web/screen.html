<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NiuB WAF 实时安全大屏</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
<style>
.wallboard{background:radial-gradient(ellipse at 85% 0%,#e0f5ee 0%,transparent 55%),var(--bg)}
.wall-header,.wallboard .wrap,.wall-footer{width:min(100%,1760px);margin:auto;padding-inline:28px}
.wall-header{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding-block:19px}
.wall-header .title{display:flex;align-items:center;gap:12px;font-size:clamp(19px,2.5vw,25px);font-weight:800;line-height:1.2}
.wall-header .logo-mark{width:43px;height:43px;border-radius:13px;background:#fff;box-shadow:var(--shadow)}
.wall-actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
#clock{font-size:12px;color:var(--dim);font-family:var(--mono);font-variant-numeric:tabular-nums}
.big-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--panel);border:1px solid var(--border);border-radius:var(--r-lg);padding:15px 18px;box-shadow:var(--shadow)}
.stat .n{font-size:clamp(22px,2.7vw,35px);font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.04em;line-height:1.25;color:var(--sky);overflow-wrap:anywhere}
.stat .n.red{color:var(--red)}
.stat .n.green{color:var(--green)}
.stat .l{color:var(--dim);font-size:12px;margin-bottom:5px;font-weight:650}
.wall-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2.1fr) minmax(0,1.1fr);grid-template-areas:"leaders map events";gap:14px}
.wall-leaders{grid-area:leaders}
.wall-map{grid-area:map}
.wall-map-heading{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.wall-map-heading h3{margin:0}
.wall-map-heading button{flex:none}
.wall-events{grid-area:events}
.wallboard .panel{padding:15px;margin-bottom:0}
.wall-leaders .panel+.panel{margin-top:14px}
.wallboard .chart{height:222px}
.wallboard .chart-geo{height:165px}
#feed{max-height:560px;overflow:auto;font-size:12px;scrollbar-width:thin}
.ev{padding:9px 4px;border-bottom:1px solid var(--border);overflow-wrap:anywhere;animation:flash 1s ease-out}
.ev:last-child{border-bottom:0}
.ev .t{color:var(--faint);font-family:var(--mono)}
.ev .ip{color:var(--amber);font-family:var(--mono)}
.ev .m{color:var(--dim);display:block;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev .tag{margin:3px 5px;padding:1px 6px}
@keyframes flash{from{background:var(--blue-soft)}to{background:transparent}}
#map-box{position:relative;height:clamp(270px,34vw,425px);margin-bottom:14px;border-radius:14px;overflow:hidden;background:radial-gradient(ellipse at center,#f8fcff,#eaf4fa)}
#c-vector,#c-map{position:absolute;inset:0;width:100%;height:100%}
#c-map{pointer-events:none}
.map-legend{position:absolute;left:9px;bottom:8px;display:flex;gap:9px;padding:4px 7px;border-radius:7px;background:#fff;color:var(--dim);font-size:10px;pointer-events:none}
.map-legend span{display:flex;align-items:center;gap:4px}
.map-legend i{display:inline-block;width:6px;height:6px;border-radius:50%}
.map-legend .source{background:#bc771e}
.map-legend .target{background:#16899e}
.map-legend .path{width:13px;height:2px;border-radius:2px;background:linear-gradient(90deg,#bc771e,#d14c6b)}
.map-source{position:absolute;right:9px;top:8px;color:var(--faint);font-size:9px;pointer-events:none}
.china-map-dialog{width:min(820px,calc(100% - 24px));max-height:calc(100% - 24px);margin:auto;padding:16px;border:1px solid var(--border);border-radius:16px;background:var(--panel);color:var(--text);box-shadow:var(--shadow-raised)}
.china-map-dialog::backdrop{background:rgba(23,42,70,.38)}
.china-map-dialog h2{margin:0;font-size:17px}
.china-map-dialog figure{margin:0}
.china-map-dialog img{display:block;width:100%;height:auto;max-height:calc(100dvh - 168px);object-fit:contain;background:#fff}
.china-map-dialog figcaption{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;margin-top:12px;color:var(--dim);font-size:12px}
.live-stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;margin:0 0 14px}
.live-stats div{min-width:0;background:var(--surface);border-radius:9px;padding:7px 4px;text-align:center}
.live-stats b{display:block;font-size:clamp(13px,1.5vw,19px);font-weight:800;color:var(--sky);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.live-stats span{font-size:10px;color:var(--dim)}
.wall-footer{text-align:center;color:var(--faint);font-size:12px;padding-block:16px}
@media(max-width:1120px){
  .wall-grid{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-areas:"map map" "leaders events"}
}
@media(max-width:650px){
  .wall-header,.wallboard .wrap,.wall-footer{padding-inline:12px}
  .wall-header{padding-block:13px}
  .wall-actions{gap:8px}
  .big-stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .stat{padding:12px}
  .wall-grid{grid-template-columns:minmax(0,1fr);grid-template-areas:"map" "events" "leaders"}
  .wallboard .panel{padding:12px}
  .map-legend{gap:6px}
}
</style>
</head>

  </div>
  <figure>
    <img src="china-standard-gs2023-2762.jpg" alt="中国全图，包含台湾岛、海南岛、钓鱼岛及其附属岛屿和南海诸岛" width="2000" height="2357" loading="lazy" decoding="async">
    <figcaption>
      <span>自然资源部监制 · GS(2023)2762号</span>
      <a href="china-standard-gs2023-2762.jpg" target="_blank" rel="noopener">打开大图</a>
      <a href="https://xinwen.bjd.com.cn/content/s64ec150ee4b03b71707d45b2.html" target="_blank" rel="noopener">图件来源</a>

  </figure>
</dialog>
<script src="echarts.min.js"></script>
<script src="topojson-client.min.js"></script>
<script src="world-110m.js"></script>
<script>
const $ = s => document.querySelector(s);
$('#open-china-map').addEventListener('click', () => $('#china-map-dialog').showModal());
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const axis = {axisLine:{lineStyle:{color:'#d7e3f0'}},axisTick:{show:false},axisLabel:{color:'#5d718d',fontSize:11},splitLine:{lineStyle:{color:'#e8eff7'}}};
const tip = {backgroundColor:'#fff',borderColor:'rgba(148,163,184,.2)',textStyle:{color:'#172a46',fontSize:12},extraCssText:'box-shadow:0 8px 24px rgba(40,70,110,.14);border-radius:10px;'};
const emptyTitle = data => ({show: !data.length,text:'暂无数据',left:'center',top:'center',textStyle:{color:'#5d718d',fontSize:13,fontWeight:400}});
const ipsC = echarts.init($('#c-ips'));
const geoC = echarts.init($('#c-geo'));

/* ---- 离线矢量世界地图 + 实时攻击轨迹（Natural Earth 110m，公共领域数据） ---- */
const mapCv=$('#c-map'),mapCtx=mapCv.getContext('2d');
const HOME={lon:104,lat:34};
let boxW=0,boxH=0;
const worldTopology=window.WORLD_TOPO;
const countries=worldTopology.objects.countries;
const worldGeo=topojson.feature(worldTopology,countries);
const china=worldGeo.features.find(f=>f.id==='156');
const chinaGeometries=countries.geometries.filter(g=>g.id==='156'||g.id==='158');
if(china&&chinaGeometries.length===2){
  // 将台湾岛及中国其他岛屿作为同一地图区域，统一底色和悬停状态。
  china.geometry=topojson.merge(worldTopology,chinaGeometries);
  china.properties.name='中国';
  worldGeo.features=worldGeo.features.filter(f=>f.id!=='158');
}
worldGeo.features=worldGeo.features.filter(f=>f.properties.name!=='Antarctica');
// 避免 ECharts 将跨日界线的短边画成横贯地图的直线。
for(const feature of worldGeo.features.filter(f=>['Russia','Fiji'].includes(f.properties.name))){
  const polygons=feature.geometry.type==='Polygon'?[feature.geometry.coordinates]:feature.geometry.coordinates;
  for(const polygon of polygons)for(const ring of polygon)for(const point of ring)if(point[0]<0)point[0]+=360;
}
echarts.registerMap('niubwaf-world',worldGeo);
const mapC=echarts.init($('#c-vector'),null,{renderer:'canvas'});
function mapLayoutSize(){
  return Math.min(mapCv.clientWidth - 16, mapCv.clientHeight * 2);
}
mapC.setOption({
  backgroundColor:'transparent',animation:false,tooltip:tip,
  geo:{
    map:'niubwaf-world',roam:false,silent:false,
    layoutCenter:['50%','49%'],layoutSize:mapLayoutSize(),aspectScale:1,
    itemStyle:{areaColor:'#c9e1f1',borderColor:'#93b6cf',borderWidth:.55,shadowColor:'rgba(46,109,149,.08)',shadowBlur:9},
    regions:[{name:'中国',itemStyle:{areaColor:'#add6e6',borderColor:'#78a8c0'}}],
    emphasis:{label:{show:false},itemStyle:{areaColor:'#9ccbe0',borderColor:'#528eac',borderWidth:.8,shadowColor:'rgba(22,137,158,.14)',shadowBlur:12}},
    select:{disabled:true},tooltip:{show:true,formatter:p=>esc(p.name)}
  }
});
const project=(lon,lat)=>mapC.convertToPixel('geo',[lon,lat]);
function buildMap(){
  const dpr=devicePixelRatio||1;
  boxW=mapCv.clientWidth;boxH=mapCv.clientHeight;
  if(!boxW||!boxH)return;
  mapCv.width=boxW*dpr;mapCv.height=boxH*dpr;mapCtx.setTransform(dpr,0,0,dpr,0,0);
  mapC.resize();mapC.setOption({geo:{layoutSize:mapLayoutSize()}});
}
let arcs=[],evCount=0,seeded=false,ripples=[];
function addArc(lon,lat,label,n,live){
  if(!lon&&!lat)return;
  const dup=arcs.find(a=>a.label===(label||'')&&Math.abs(a.lon-lon)<1.4&&Math.abs(a.lat-lat)<0.5);
  if(dup){dup.n+=(n||1);dup.born=performance.now();dup.live=false;if(label)dup.label=label;return;}
  arcs.push({lon,lat,label:label||'',n:n||1,born:performance.now(),seed:Math.random()*1000,live:!!live,lastT:0});
  if(arcs.length>48)arcs.shift();
}
function placeMapLabels(hx,hy){
  mapCtx.font='600 10.5px sans-serif';
  const placed=[{x:hx-32,y:hy-33,w:78,h:66}],out=[];
  for(const a of arcs.slice(-10)){
    if(!a.label)continue;
    const name=a.label.length>8?a.label.slice(0,8)+'…':a.label;
    const txt=name+(a.n>1?' ×'+a.n:''),w=mapCtx.measureText(txt).width+8,h=18;
    const p=project(a.lon,a.lat),sx=p[0],sy=p[1],candidates=[];
    for(const d of [10,54,98,142,186]){
      for(const dy of [-100,-63,-26,9,46,83,120]){
        candidates.push([sx+d,sy+dy],[sx-w-d-4,sy+dy]);
        if(d===10)candidates.push([sx-w/2,sy+dy]);
      }
    }
    let best=null,bestScore=Infinity;
    for(const c of candidates){
      const r={x:Math.max(4,Math.min(boxW-w-4,c[0])),y:Math.max(4,Math.min(boxH-84,c[1])),w,h};
      let hits=0;
      for(const p of placed)if(r.x<p.x+p.w+5&&r.x+r.w+5>p.x&&r.y<p.y+p.h+5&&r.y+r.h+5>p.y)hits++;
      const tx=Math.max(r.x,Math.min(sx,r.x+w)),ty=Math.max(r.y,Math.min(sy,r.y+h));
      const score=hits*100000+Math.hypot(tx-sx,ty-sy)+Math.hypot(r.x-c[0],r.y-c[1])*1.5;
      if(score<bestScore){bestScore=score;best=r;}
    }
    placed.push(best);
    out.push({...best,sx,sy,txt});
  }
  return out;
}
function frame(now){
  if(boxW){
    mapCtx.clearRect(0,0,boxW,boxH);
    arcs=arcs.filter(a=>!a.live||now-a.born<14000);
    ripples=ripples.filter(r=>now-r.born<1500);
    const hp=project(HOME.lon,HOME.lat),hx=hp[0],hy=hp[1];
    for(const a of arcs){
      const ap=project(a.lon,a.lat),sx=ap[0],sy=ap[1],dx=hx,dy=hy;
      const dist=Math.hypot(dx-sx,dy-sy)||1;
      const cxp=(sx+dx)/2-(dy-sy)*0.22,cyp=Math.max(Math.min(sy,dy),(sy+dy)/2+(dx-sx)*0.22-dist*0.08);
      // 轨迹线：琥珀(源)→玫红(本站)渐变
      const alpha=Math.min(0.6,0.18+a.n*0.04);
      const grad=mapCtx.createLinearGradient(sx,sy,dx,dy);
      grad.addColorStop(0,`rgba(188,119,30,${(alpha*0.65).toFixed(3)})`);
      grad.addColorStop(1,`rgba(209,76,107,${alpha.toFixed(3)})`);
      mapCtx.beginPath();mapCtx.moveTo(sx,sy);mapCtx.quadraticCurveTo(cxp,cyp,dx,dy);
      mapCtx.strokeStyle=grad;
      mapCtx.lineWidth=Math.min(2.6,0.8+Math.log2(1+a.n)*0.5);mapCtx.stroke();
      // 彗头 + 渐隐拖尾；每绕完一圈在本站激起拦截涟漪
      const t=((now-a.born)/2600+a.seed)%1;
      if(t<a.lastT)ripples.push({born:now});
      a.lastT=t;
      for(let k=8;k>=0;k--){
        const tt=t-k*0.025;
        if(tt<0)continue;
        const it=1-tt;
        const px=it*it*sx+2*it*tt*cxp+tt*tt*dx,py=it*it*sy+2*it*tt*cyp+tt*tt*dy;
        mapCtx.beginPath();mapCtx.arc(px,py,k===0?2.4:1.8*(1-k/10),0,Math.PI*2);
        mapCtx.fillStyle=`rgba(209,76,107,${((1-k/9)*0.85).toFixed(3)})`;
        if(k===0){mapCtx.shadowColor='#d14c6b';mapCtx.shadowBlur=12;}
        mapCtx.fill();mapCtx.shadowBlur=0;
      }
      // 源点：光晕 + 扩散环 + 核心
      const sr=(now%1800)/1800;
      mapCtx.beginPath();mapCtx.arc(sx,sy,2+sr*9,0,Math.PI*2);
      mapCtx.strokeStyle=`rgba(188,119,30,${(0.45*(1-sr)).toFixed(3)})`;mapCtx.lineWidth=1;mapCtx.stroke();
      mapCtx.beginPath();mapCtx.arc(sx,sy,4.5,0,Math.PI*2);mapCtx.fillStyle='rgba(188,119,30,.16)';mapCtx.fill();
      mapCtx.beginPath();mapCtx.arc(sx,sy,2,0,Math.PI*2);mapCtx.fillStyle='#bc771e';mapCtx.fill();
    }
    const labels=placeMapLabels(hx,hy);
    for(const l of labels){
      const tx=Math.max(l.x,Math.min(l.sx,l.x+l.w)),ty=Math.max(l.y,Math.min(l.sy,l.y+l.h));
      if(Math.hypot(tx-l.sx,ty-l.sy)>18){
        mapCtx.beginPath();mapCtx.moveTo(l.sx,l.sy);mapCtx.lineTo(tx,ty);
        mapCtx.strokeStyle='rgba(188,119,30,.28)';mapCtx.lineWidth=0.8;mapCtx.stroke();
      }
      mapCtx.fillStyle='rgba(255,255,255,.92)';
      mapCtx.beginPath();mapCtx.roundRect(l.x,l.y,l.w,l.h,4);mapCtx.fill();
      mapCtx.fillStyle='#865411';mapCtx.fillText(l.txt,l.x+4,l.y+13);
    }
    // 拦截到达涟漪
    for(const rp of ripples){
      const p=(now-rp.born)/1500;
      mapCtx.beginPath();mapCtx.arc(hx,hy,7+p*32,0,Math.PI*2);
      mapCtx.strokeStyle=`rgba(209,76,107,${(0.5*(1-p)).toFixed(3)})`;mapCtx.lineWidth=1.4;mapCtx.stroke();
    }
    // 本站：双层脉冲 + 高亮核心 + 标签
    const pr=(now%2400)/2400;
    for(const off of [0,0.5]){
      const p=(pr+off)%1;
      mapCtx.beginPath();mapCtx.arc(hx,hy,6+p*26,0,Math.PI*2);
      mapCtx.strokeStyle=`rgba(22,137,158,${(0.5*(1-p)).toFixed(3)})`;mapCtx.lineWidth=1.6;mapCtx.stroke();
    }
    mapCtx.beginPath();mapCtx.arc(hx,hy,9,0,Math.PI*2);mapCtx.fillStyle='rgba(22,137,158,.18)';mapCtx.fill();
    mapCtx.beginPath();mapCtx.arc(hx,hy,5,0,Math.PI*2);
    mapCtx.fillStyle='#16899e';mapCtx.shadowColor='#16899e';mapCtx.shadowBlur=16;mapCtx.fill();mapCtx.shadowBlur=0;
    mapCtx.font='600 11px sans-serif';
    mapCtx.fillStyle='rgba(255,255,255,.92)';
    mapCtx.beginPath();mapCtx.roundRect(hx+8,hy-20,36,17,4);mapCtx.fill();
    mapCtx.fillStyle='#096c83';mapCtx.fillText('本站',hx+12,hy-8);
  }
  requestAnimationFrame(frame);
}
buildMap();
requestAnimationFrame(frame);
window.addEventListener('resize', () => { [ipsC, geoC].forEach(c => c.resize()); buildMap(); });

function updateClock() { $('#clock').textContent = new Date().toLocaleString('zh-CN', {hour12: false}); }
updateClock();
setInterval(updateClock, 1000);

async function j(p) { const r = await fetch(p); if (!r.ok) throw new Error(r.status); return r.json(); }

async function refresh() {
  try {
    const [st, ips, geo, an] = await Promise.all([j('/api/stats'), j('/api/top/ips'), j('/api/top/countries'), j('/api/analytics?hours=24')]);
    $('#s-reqs').textContent = st.today_reqs.toLocaleString();
    $('#s-blocks').textContent = st.today_blocks.toLocaleString();
    $('#s-sites').textContent = st.sites_enabled;
    $('#s-total').textContent = st.total_blocks.toLocaleString();
    $('#m-blocked').textContent = ((an.totals && an.totals.blocked) || 0).toLocaleString();
    $('#m-srcs').textContent = an.arc_srcs || (an.arcs || []).length;
    if (!seeded) { seeded = true; (an.arcs || []).forEach(a => addArc(a.lon, a.lat, a.name || a.key, a.count, false)); }
    ipsC.setOption({
      title:emptyTitle(ips),
      tooltip:tip, grid:{left:10,right:30,top:10,bottom:10,containLabel:true},
      xAxis:{type:'value',...axis,show:!!ips.length},
      yAxis:{type:'category',inverse:true,data:ips.map(k=>k.city?k.key+' '+k.city:k.key),...axis,show:!!ips.length},
      series:[{type:'bar',data:ips.map(k=>k.count),barMaxWidth:14,itemStyle:{borderRadius:[0,6,6,0],color:new echarts.graphic.LinearGradient(0,0,1,0,[{offset:0,color:'#bc771e40'},{offset:1,color:'#bc771e'}])}}]
    });
    geoC.setOption({
      title:emptyTitle(geo),
      tooltip:{trigger:'item',...tip},
      color:['#3b71df','#5364da','#805cca','#bc771e','#d14c6b','#168a70','#16899e','#bb5a9b'],
      series:[{type:'pie',showEmptyCircle:false,radius:['42%','70%'],data:geo.map(k=>({name:k.key,value:k.count})),
        label:{color:'#5d718d',fontSize:11},itemStyle:{borderColor:'#fff',borderWidth:2,borderRadius:5}}]
    });
  } catch (e) { console.warn(e); }
}
refresh();
setInterval(refresh, 10000);
j('/api/qps').then(d => { $('#m-qps').textContent = d.qps; $('#m-qp').textContent = d.peak; }).catch(() => {});

const tag = a => ({waf:'<span class="tag red">WAF拦截</span>',resp:'<span class="tag red">响应拦截</span>',cc:'<span class="tag orange">CC限频</span>',blacklist:'<span class="tag red">黑名单</span>',geo:'<span class="tag blue">地区限制</span>',semantic:'<span class="tag blue">语义检测</span>',reputation:'<span class="tag orange">信誉封禁</span>',custom:'<span class="tag violet">自定义</span>',dynamic:'<span class="tag cyan">动态防护</span>',bot:'<span class="tag violet">Bot防护</span>'}[a] || esc(a));
const es = new EventSource('/api/events');
es.onmessage = ev => {
  const d = JSON.parse(ev.data);
  if (d.type === 'qps') {
    $('#m-qps').textContent = d.qps;
    $('#m-qp').textContent = d.peak;
    return;
  }
  if (d.type !== 'attack' || d.status === 200) return;
  evCount++; $('#m-events').textContent = evCount;
  if (d.lat || d.lon) addArc(d.lon, d.lat, d.city || d.country || d.ip, 1, true);
  const feed = $('#feed');
  $('#feed-empty')?.remove();
  feed.insertAdjacentHTML('afterbegin', `<div class="ev"><span class="t">${esc(d.ts)}</span>${tag(d.action)}<span class="ip">${esc(d.ip)}</span>${d.city ? ' · ' + esc(d.city) : (d.country ? ' · ' + esc(d.country) : '')} → ${esc(d.domain)}<span class="m">${esc(d.method)} ${esc(d.url)} · ${esc(d.msg)}</span></div>`);
  while (feed.children.length > 60) feed.lastChild.remove();
};
j('/api/logs?size=20&attack_only=1').then(d => {
  d.list.reverse().forEach(l => es.onmessage({data: JSON.stringify({type:'attack',ts:l.ts,ip:l.client_ip,country:l.country,city:l.city,domain:l.domain,method:l.method,url:l.url,action:l.action,msg:l.msg,status:l.status})}));
}).catch(() => {});
</script>
</body>
</html>
