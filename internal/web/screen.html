<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NiuB WAF 实时安全大屏</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
<style>
.wallboard{background:radial-gradient(ellipse at 85% 0%,#e0f5ee 0%,transparent 55%),var(--bg)}
.wall-header,.wallboard .wrap,.wall-footer{width:min(100%,1760px);margin:auto;padding-inline:28px}
.wall-header{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding-block:19px}
.wall-header .title{display:flex;align-items:center;gap:12px;font-size:clamp(19px,2.5vw,25px);font-weight:800;line-height:1.2}
.wall-header .logo-mark{width:43px;height:43px;border-radius:13px;background:#fff;box-shadow:var(--shadow)}
.wall-actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
#clock{font-size:12px;color:var(--dim);font-family:var(--mono);font-variant-numeric:tabular-nums}
.big-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--panel);border:1px solid var(--border);border-radius:var(--r-lg);padding:15px 18px;box-shadow:var(--shadow)}
.stat .n{font-size:clamp(22px,2.7vw,35px);font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.04em;line-height:1.25;color:var(--sky);overflow-wrap:anywhere}
.stat .n.red{color:var(--red)}
.stat .n.green{color:var(--green)}
.stat .l{color:var(--dim);font-size:12px;margin-bottom:5px;font-weight:650}
.wall-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2.1fr) minmax(0,1.1fr);grid-template-areas:"leaders map events";gap:14px}
.wall-leaders{grid-area:leaders}
.wall-map{grid-area:map}
.wall-map-heading{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.wall-map-heading h3{margin:0}
.wall-map-heading button{flex:none}
.wall-events{grid-area:events}
.wallboard .panel{padding:15px;margin-bottom:0}
.wall-leaders .panel+.panel{margin-top:14px}
.wallboard .chart{height:222px}
.wallboard .chart-geo{height:165px}
#feed{max-height:560px;overflow:auto;font-size:12px;scrollbar-width:thin}
.ev{padding:9px 6px;border-bottom:1px solid var(--border);overflow-wrap:anywhere}
.ev.is-active{background:var(--blue-soft);box-shadow:inset 3px 0 var(--sky);border-radius:6px}
.ev:last-child{border-bottom:0}
.ev .t{color:var(--faint);font-family:var(--mono)}
.ev .ip{color:var(--amber);font-family:var(--mono)}
.ev .unlocated{color:var(--faint)}
.ev .m{color:var(--dim);display:block;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev .tag{margin:3px 5px;padding:1px 6px}
.feed-connection{color:var(--faint);font-size:11px;margin:0 0 8px}
#map-box{position:relative;height:clamp(270px,34vw,425px);margin-bottom:14px;border-radius:14px;overflow:hidden;background:radial-gradient(ellipse at center,#f8fcff,#eaf4fa)}
#c-vector,#c-map{position:absolute;inset:0;width:100%;height:100%}
#c-map{pointer-events:none}
.map-legend{position:absolute;left:9px;bottom:8px;display:flex;flex-wrap:wrap;gap:4px 9px;max-width:calc(100% - 18px);padding:4px 7px;border-radius:7px;background:#fff;color:var(--dim);font-size:11px;pointer-events:none}
.map-legend span{display:flex;align-items:center;gap:4px}
.map-legend i{display:inline-block;width:6px;height:6px;border-radius:50%}
.map-legend .source{background:#bc771e}
.map-legend .target{background:#16899e}
.map-legend .path{width:13px;height:2px;border-radius:2px;background:linear-gradient(90deg,#bc771e,#d14c6b)}
.map-source{position:absolute;right:9px;top:8px;color:var(--faint);font-size:9px;pointer-events:none}
.map-flight{position:absolute;z-index:2;display:grid;gap:3px;min-width:132px;max-width:min(210px,calc(100% - 16px));padding:7px 9px;border:1px solid var(--border);border-radius:9px;background:var(--panel);box-shadow:var(--shadow);color:var(--text);font-size:12px;line-height:1.35;pointer-events:none;overflow-wrap:anywhere}
.map-flight[hidden]{display:none}
.map-flight-mode{justify-self:start;padding:2px 5px;border-radius:4px;background:#fff0f3;color:var(--red);font-size:11px;font-weight:700}
.map-flight[data-mode="replay"] .map-flight-mode{background:var(--blue-soft);color:var(--sky)}
.map-flight-ip{font-family:var(--mono)}
.map-flight-detail{color:var(--dim);font-size:11px}
.map-note{margin-top:-6px;color:var(--faint);font-size:11px}
.china-map-dialog{width:min(820px,calc(100% - 24px));max-height:calc(100% - 24px);margin:auto;padding:16px;border:1px solid var(--border);border-radius:16px;background:var(--panel);color:var(--text);box-shadow:var(--shadow-raised)}
.china-map-dialog::backdrop{background:rgba(23,42,70,.38)}
.china-map-dialog h2{margin:0;font-size:17px}
.china-map-dialog figure{margin:0}
.china-map-dialog img{display:block;width:100%;height:auto;max-height:calc(100dvh - 168px);object-fit:contain;background:#fff}
.china-map-dialog figcaption{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;margin-top:12px;color:var(--dim);font-size:12px}
.live-stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;margin:0 0 14px}
.live-stats div{min-width:0;background:var(--surface);border-radius:9px;padding:7px 4px;text-align:center}
.live-stats b{display:block;font-size:clamp(13px,1.5vw,19px);font-weight:800;color:var(--sky);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.live-stats span{font-size:10px;color:var(--dim)}
.wall-footer{text-align:center;color:var(--faint);font-size:12px;padding-block:16px}
@media(max-width:1120px){
  .wall-grid{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-areas:"map map" "leaders events"}
}
@media(max-width:650px){
  .wall-header,.wallboard .wrap,.wall-footer{padding-inline:12px}
  .wall-header{padding-block:13px}
  .wall-actions{gap:8px}
  .big-stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .stat{padding:12px}
  .wall-grid{grid-template-columns:minmax(0,1fr);grid-template-areas:"map" "events" "leaders"}
  .wallboard .panel{padding:12px}
  .map-legend{gap:6px}
}
</style>
</head>
<body class="wallboard">
<header class="wall-header">
  <h1 class="title">
    <span class="logo-mark" aria-hidden="true"><img src="brand-icon.svg" alt=""></span>
    <span>NiuB WAF 实时安全大屏</span>
  </h1>
  <div class="wall-actions"><time id="clock"></time><a class="btn ghost sm" href="./">返回控制台</a></div>
</header>
<div class="wrap">
  <div class="big-stats">
    <div class="stat"><div class="l">今日请求总量</div><div class="n" id="s-reqs">0</div></div>
    <div class="stat"><div class="l">今日拦截攻击</div><div class="n red" id="s-blocks">0</div></div>
    <div class="stat"><div class="l">防护站点</div><div class="n green" id="s-sites">0</div></div>
    <div class="stat"><div class="l">累计拦截</div><div class="n" id="s-total">0</div></div>
  </div>
  <div class="wall-grid">
    <div class="wall-leaders">
      <div class="panel"><h3>攻击源 IP Top10</h3><div id="c-ips" class="chart"></div></div>
      <div class="panel"><h3>攻击来源国家/地区</h3><div id="c-geo" class="chart chart-geo"></div></div>
    </div>
    <div class="panel wall-map">
      <div class="wall-map-heading">
        <h3><span class="live-dot"></span>全球攻击轨迹</h3>
        <button id="open-china-map" type="button" class="btn ghost sm" aria-haspopup="dialog" aria-controls="china-map-dialog">中国全图</button>
      </div>
      <div class="live-stats">
        <div><b id="m-qps">0</b><span>实时 QPS</span></div>
        <div><b id="m-qp">0</b><span>60s 峰值</span></div>
        <div><b id="m-blocked">0</b><span>24H 拦截</span></div>
        <div><b id="m-srcs">0</b><span>攻击源地域</span></div>
        <div><b id="m-events">0</b><span>本次实时事件</span></div>
      </div>
      <div id="map-box">
        <div id="c-vector"></div><canvas id="c-map"></canvas>
        <div id="map-flight" class="map-flight" hidden>
          <span id="map-flight-mode" class="map-flight-mode"></span>
          <strong id="map-flight-place"></strong>
          <span id="map-flight-ip" class="map-flight-ip"></span>
          <span id="map-flight-target" class="map-flight-detail"></span>
          <time id="map-flight-time" class="map-flight-detail"></time>
        </div>
        <div class="map-legend"><span><i class="source"></i>攻击来源</span><span><i class="target"></i>站点示意落点</span><span><i class="path"></i>攻击轨迹</span></div>
        <div class="map-source">Natural Earth · 110m</div>
      </div>
      <p class="map-note">来源按 IP 归属地估算。<span id="map-unlocated"></span></p>
    </div>
    <div class="panel wall-events"><h3><span class="live-dot"></span>实时攻击事件</h3><p id="feed-connection" class="feed-connection" role="status" hidden></p><div id="feed"><p class="empty">暂无攻击事件</p></div></div>
  </div>
</div>
<footer class="wall-footer">NiuB WAF · Coraza 智能语义分析引擎 + OWASP CRS 规则集 · 数据每 10 秒刷新</footer>
<dialog id="china-map-dialog" class="china-map-dialog" aria-labelledby="china-map-title">
  <div class="wall-map-heading">
    <h2 id="china-map-title">中国全图</h2>
    <form method="dialog"><button class="btn ghost sm" autofocus>关闭</button></form>
  </div>
  <figure>
    <img src="china-standard-gs2023-2762.jpg" alt="中国全图，包含台湾岛、海南岛、钓鱼岛及其附属岛屿和南海诸岛" width="2000" height="2357" loading="lazy" decoding="async">
    <figcaption>
      <span>自然资源部监制 · GS(2023)2762号</span>
      <a href="china-standard-gs2023-2762.jpg" target="_blank" rel="noopener">打开大图</a>
      <a href="https://xinwen.bjd.com.cn/content/s64ec150ee4b03b71707d45b2.html" target="_blank" rel="noopener">图件来源</a>
    </figcaption>
  </figure>
</dialog>
<script src="echarts.min.js"></script>
<script src="topojson-client.min.js"></script>
<script src="world-110m.js"></script>
<script src="screen-events.js"></script>
<script>
const $ = s => document.querySelector(s);
$('#open-china-map').addEventListener('click', () => $('#china-map-dialog').showModal());
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const axis = {axisLine:{lineStyle:{color:'#d7e3f0'}},axisTick:{show:false},axisLabel:{color:'#5d718d',fontSize:11},splitLine:{lineStyle:{color:'#e8eff7'}}};
const tip = {backgroundColor:'#fff',borderColor:'rgba(148,163,184,.2)',textStyle:{color:'#172a46',fontSize:12},extraCssText:'box-shadow:0 8px 24px rgba(40,70,110,.14);border-radius:10px;'};
const emptyTitle = data => ({show: !data.length,text:'暂无数据',left:'center',top:'center',textStyle:{color:'#5d718d',fontSize:13,fontWeight:400}});
const ipsC = echarts.init($('#c-ips'));
const geoC = echarts.init($('#c-geo'));

/* ---- 离线矢量世界地图 + 实时攻击轨迹（Natural Earth 110m，公共领域数据） ---- */
const mapCv=$('#c-map'),mapCtx=mapCv.getContext('2d');
const HOME={lon:104,lat:34};
let boxW=0,boxH=0;
const worldTopology=window.WORLD_TOPO;
const countries=worldTopology.objects.countries;
const worldGeo=topojson.feature(worldTopology,countries);
const china=worldGeo.features.find(f=>f.id==='156');
const chinaGeometries=countries.geometries.filter(g=>g.id==='156'||g.id==='158');
if(china&&chinaGeometries.length===2){
  // 将台湾岛及中国其他岛屿作为同一地图区域，统一底色和悬停状态。
  china.geometry=topojson.merge(worldTopology,chinaGeometries);
  china.properties.name='中国';
  worldGeo.features=worldGeo.features.filter(f=>f.id!=='158');
}
worldGeo.features=worldGeo.features.filter(f=>f.properties.name!=='Antarctica');
// 避免 ECharts 将跨日界线的短边画成横贯地图的直线。
for(const feature of worldGeo.features.filter(f=>['Russia','Fiji'].includes(f.properties.name))){
  const polygons=feature.geometry.type==='Polygon'?[feature.geometry.coordinates]:feature.geometry.coordinates;
  for(const polygon of polygons)for(const ring of polygon)for(const point of ring)if(point[0]<0)point[0]+=360;
}
echarts.registerMap('niubwaf-world',worldGeo);
const mapC=echarts.init($('#c-vector'),null,{renderer:'canvas'});
function mapLayoutSize(){
  return Math.min(mapCv.clientWidth - 16, mapCv.clientHeight * 2);
}
mapC.setOption({
  backgroundColor:'transparent',animation:false,tooltip:tip,
  geo:{
    map:'niubwaf-world',roam:false,silent:false,
    layoutCenter:['50%','49%'],layoutSize:mapLayoutSize(),aspectScale:1,
    itemStyle:{areaColor:'#c9e1f1',borderColor:'#93b6cf',borderWidth:.55,shadowColor:'rgba(46,109,149,.08)',shadowBlur:9},
    regions:[{name:'中国',itemStyle:{areaColor:'#add6e6',borderColor:'#78a8c0'}}],
    emphasis:{label:{show:false},itemStyle:{areaColor:'#9ccbe0',borderColor:'#528eac',borderWidth:.8,shadowColor:'rgba(22,137,158,.14)',shadowBlur:12}},
    select:{disabled:true},tooltip:{show:true,formatter:p=>esc(p.name)}
  }
});
const project=(lon,lat)=>mapC.convertToPixel('geo',[lon,lat]);
function buildMap(){
  const dpr=devicePixelRatio||1;
  boxW=mapCv.clientWidth;boxH=mapCv.clientHeight;
  if(!boxW||!boxH)return;
  mapCv.width=boxW*dpr;mapCv.height=boxH*dpr;mapCtx.setTransform(dpr,0,0,dpr,0,0);
  mapC.resize();mapC.setOption({geo:{layoutSize:mapLayoutSize()}});
  mapDirty = true;
}
const timeline = new ScreenAttackTimeline();
const mapCard = $('#map-flight');
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');
const flightTime = 1350;
const arrivalTime = 950;
let flight = null, evCount = 0, mapDirty = true, feedDirty = true;
let aggregateSources = [], mapPoints = [], feedRows = new Map();

function updateMapPoints() {
  const places = new Map();
  for (const point of [...aggregateSources, ...timeline.recent.filter(event => event.located)]) {
    if (!Number.isFinite(point.lon) || !Number.isFinite(point.lat) || (!point.lon && !point.lat)) continue;
    places.set(point.lon.toFixed(3) + ',' + point.lat.toFixed(3), point);
  }
  mapPoints = [...places.values()];
  mapDirty = true;
}

function highlightFeed(reveal = false) {
  const active = feedRows.get(flight?.event.key);
  for (const row of feedRows.values()) row.classList.toggle('is-active', row === active);
  if (!reveal || !active) return;
  const feed = $('#feed');
  const viewport = feed.getBoundingClientRect();
  const row = active.getBoundingClientRect();
  if (row.top < viewport.top) feed.scrollTop += row.top - viewport.top;
  else if (row.bottom > viewport.bottom) feed.scrollTop += row.bottom - viewport.bottom;
}

function setFlight(cue, now) {
  flight = cue && { ...cue, started: now };
  mapCard.hidden = !flight;
  mapDirty = true;
  highlightFeed(true);
  if (!flight) return;

  const { mode, event } = flight;
  mapCard.dataset.mode = mode;
  $('#map-flight-mode').textContent = mode === 'live' ? '实时事件' : '历史回放';
  $('#map-flight-place').textContent = event.city || event.country || '攻击来源';
  $('#map-flight-ip').textContent = event.ip;
  $('#map-flight-target').textContent = '目标 · ' + (event.domain || '受保护站点');
  $('#map-flight-time').textContent = event.ts;
}

function positionCard(x, y) {
  const width = mapCard.offsetWidth, height = mapCard.offsetHeight;
  const left = x + width + 20 < boxW ? x + 12 : x - width - 12;
  const top = y - height - 9 >= 8 ? y - height - 9 : y + 10;
  mapCard.style.left = Math.max(8, Math.min(boxW - width - 8, left)) + 'px';
  mapCard.style.top = Math.max(8, Math.min(boxH - height - 32, top)) + 'px';
}

function dot(x, y, radius, color) {
  mapCtx.beginPath();
  mapCtx.arc(x, y, radius, 0, Math.PI * 2);
  mapCtx.fillStyle = color;
  mapCtx.fill();
}

function drawFlight(now, dx, dy) {
  const { event, mode, started } = flight;
  const from = project(event.lon, event.lat);
  if (!from?.every(Number.isFinite)) {
    mapCard.hidden = true;
    return;
  }
  const [sx, sy] = from;
  if (mapDirty) positionCard(sx, sy);
  const elapsed = now - started;
  const progress = reduceMotion.matches ? 1 : Math.min(1, elapsed / flightTime);
  const lift = Math.max(28, Math.min(116, Math.hypot(dx - sx, dy - sy) * .27));
  const cx = (sx + dx) / 2;
  const cy = Math.min(sy, dy) - lift;
  const partialX = sx + (cx - sx) * progress;
  const partialY = sy + (cy - sy) * progress;
  const px = partialX + (cx + (dx - cx) * progress - partialX) * progress;
  const py = partialY + (cy + (dy - cy) * progress - partialY) * progress;
  const color = mode === 'live' ? '#c53063' : '#365bd6';
  const gradient = mapCtx.createLinearGradient(sx, sy, dx, dy);
  gradient.addColorStop(0, '#cb791f');
  gradient.addColorStop(1, color);
  mapCtx.beginPath();
  mapCtx.moveTo(sx, sy);
  mapCtx.quadraticCurveTo(partialX, partialY, px, py);
  mapCtx.strokeStyle = gradient;
  mapCtx.lineWidth = mode === 'live' ? 2.8 : 2;
  mapCtx.stroke();
  dot(sx, sy, 4.5, '#cb791f');
  dot(px, py, 4, color);
  if (progress === 1) {
    const fade = reduceMotion.matches ? .32 : Math.max(0, 1 - (elapsed - flightTime) / arrivalTime);
    mapCtx.save();
    mapCtx.globalAlpha = fade;
    mapCtx.beginPath();
    mapCtx.arc(dx, dy, 9 + (1 - fade) * 20, 0, Math.PI * 2);
    mapCtx.strokeStyle = color;
    mapCtx.lineWidth = 2;
    mapCtx.stroke();
    mapCtx.restore();
  }
}

function drawMap(now) {
  mapCtx.clearRect(0, 0, boxW, boxH);
  for (const point of mapPoints) {
    const projected = project(point.lon, point.lat);
    if (projected?.every(Number.isFinite)) dot(...projected, 2.7, 'rgba(182,107,26,.55)');
  }
  const home = project(HOME.lon, HOME.lat);
  if (home?.every(Number.isFinite)) {
    dot(...home, 9, 'rgba(22,137,158,.18)');
    dot(...home, 5, '#16899e');
    if (flight) drawFlight(now, ...home);
  }
  mapDirty = false;
}

function frame(now) {
  if (feedDirty) renderFeed();
  if (boxW) {
    if (flight && (now - flight.started >= flightTime + arrivalTime || !feedRows.has(flight.event.key) ||
      (flight.mode === 'replay' && timeline.hasLive(now)))) {
      setFlight(null, now);
    }
    if (!flight) {
      const next = timeline.take(now);
      if (next) setFlight(next, now);
    }
    if (mapDirty || flight) drawMap(now);
  }
  requestAnimationFrame(frame);
}
buildMap();
requestAnimationFrame(frame);
window.addEventListener('resize', () => { [ipsC, geoC].forEach(c => c.resize()); buildMap(); });

function updateClock() { $('#clock').textContent = new Date().toLocaleString('zh-CN', {hour12: false}); }
updateClock();
setInterval(updateClock, 1000);

async function j(p, options) {
  const response = await fetch(p, options);
  if (!response.ok) throw Object.assign(new Error(response.status), { status: response.status });
  return response.json();
}

async function refresh() {
  try {
    const [st, ips, geo, an] = await Promise.all([j('/api/stats'), j('/api/top/ips'), j('/api/top/countries'), j('/api/analytics?hours=24')]);
    $('#s-reqs').textContent = st.today_reqs.toLocaleString();
    $('#s-blocks').textContent = st.today_blocks.toLocaleString();
    $('#s-sites').textContent = st.sites_enabled;
    $('#s-total').textContent = st.total_blocks.toLocaleString();
    $('#m-blocked').textContent = ((an.totals && an.totals.blocked) || 0).toLocaleString();
    $('#m-srcs').textContent = an.arc_srcs || (an.arcs || []).length;
    aggregateSources = an.arcs || [];
    updateMapPoints();
    ipsC.setOption({
      title:emptyTitle(ips),
      tooltip:tip, grid:{left:10,right:30,top:10,bottom:10,containLabel:true},
      xAxis:{type:'value',...axis,show:!!ips.length},
      yAxis:{type:'category',inverse:true,data:ips.map(k=>k.city?k.key+' '+k.city:k.key),...axis,show:!!ips.length},
      series:[{type:'bar',data:ips.map(k=>k.count),barMaxWidth:14,itemStyle:{borderRadius:[0,6,6,0],color:new echarts.graphic.LinearGradient(0,0,1,0,[{offset:0,color:'#bc771e40'},{offset:1,color:'#bc771e'}])}}]
    });
    geoC.setOption({
      title:emptyTitle(geo),
      tooltip:{trigger:'item',...tip},
      color:['#3b71df','#5364da','#805cca','#bc771e','#d14c6b','#168a70','#16899e','#bb5a9b'],
      series:[{type:'pie',showEmptyCircle:false,radius:['42%','70%'],data:geo.map(k=>({name:k.key,value:k.count})),
        label:{color:'#5d718d',fontSize:11},itemStyle:{borderColor:'#fff',borderWidth:2,borderRadius:5}}]
    });
  } catch (e) { console.warn(e); }
}
refresh();
setInterval(refresh, 10000);
j('/api/qps').then(d => { $('#m-qps').textContent = d.qps; $('#m-qp').textContent = d.peak; }).catch(() => {});

const tag = a => ({waf:'<span class="tag red">WAF拦截</span>',resp:'<span class="tag red">响应拦截</span>',cc:'<span class="tag orange">CC限频</span>',blacklist:'<span class="tag red">黑名单</span>',geo:'<span class="tag blue">地区限制</span>',semantic:'<span class="tag blue">语义检测</span>',reputation:'<span class="tag orange">信誉封禁</span>',custom:'<span class="tag violet">自定义</span>',dynamic:'<span class="tag cyan">动态防护</span>',bot:'<span class="tag violet">Bot防护</span>',api_schema:'<span class="tag violet">API 契约</span>'}[a] || esc(a));

function renderFeed() {
  const feed = $('#feed');
  const unlocated = timeline.recent.filter(event => !event.located).length;
  $('#map-unlocated').textContent = unlocated ? '近期 ' + unlocated + ' 条日志未定位。' : '';
  feed.innerHTML = timeline.recent.map(event => {
    const place = event.city || event.country;
    const location = place ? ' · ' + esc(place) : '';
    const unknown = event.located ? '' : '<span class="unlocated"> · 未定位</span>';
    return '<div class="ev" data-event="' + esc(event.key) + '"><span class="t">' + esc(event.ts) + '</span>' +
      tag(event.action) + '<span class="ip">' + esc(event.ip) + '</span>' + location + unknown +
      ' → ' + esc(event.domain) + '<span class="m">' + esc(event.method) + ' ' + esc(event.url) +
      ' · ' + esc(event.msg) + '</span></div>';
  }).join('') || '<p class="empty">暂无攻击事件</p>';
  feedRows = new Map([...feed.querySelectorAll('.ev')].map(row => [row.dataset.event, row]));
  highlightFeed();
  feedDirty = false;
}

let historyLoading = false;
let historyStatus = 0;
let streamInterrupted = false;
let es;
const feedConnection = $('#feed-connection');

function showFeedStatus() {
  let message = '';
  if (historyStatus === 401) {
    message = '登录已失效，请通过管理控制台重新登录。';
  } else if (historyStatus === 403) {
    message = '当前登录无法查看攻击日志，请检查管理控制台。';
  } else if (historyStatus && historyStatus !== 200) {
    message = streamInterrupted
      ? '实时连接暂不可用，攻击日志补载失败，正在重试。'
      : '攻击日志补载失败，正在重试。';
  } else if (streamInterrupted) {
    message = historyStatus === 200
      ? '实时连接暂不可用，当前显示攻击日志。'
      : '实时连接暂不可用，正在尝试补载攻击日志。';
  }
  if (feedConnection.textContent === message) return;
  feedConnection.textContent = message;
  feedConnection.hidden = !message;
}

async function refreshHistory() {
  if (historyLoading) return;
  historyLoading = true;
  try {
    const result = await j('/api/logs?screen=1', { cache: 'no-store' });
    timeline.mergeHistory(result.list);
    updateMapPoints();
    feedDirty = true;
    historyStatus = 200;
    // EventSource does not retry a connection closed by an HTTP error.
    if (es.readyState === EventSource.CLOSED) connectFeed();
  } catch (e) {
    historyStatus = e.status || 503;
    if (historyStatus !== 401 && historyStatus !== 403) console.warn('攻击日志补载失败', e);
  } finally {
    historyLoading = false;
    showFeedStatus();
  }
}

function handleFeedEvent(ev) {
  const d = JSON.parse(ev.data);
  if (d.type === 'qps') {
    $('#m-qps').textContent = d.qps;
    $('#m-qp').textContent = d.peak;
    return;
  }
  if (d.type !== 'attack' || !timeline.addLive(d, performance.now())) return;
  $('#m-events').textContent = ++evCount;
  updateMapPoints();
  feedDirty = true;
}

function connectFeed() {
  es = new EventSource('/api/events');
  es.onopen = () => {
    streamInterrupted = false;
    showFeedStatus();
    refreshHistory();
  };
  es.onerror = () => {
    streamInterrupted = true;
    showFeedStatus();
  };
  es.onmessage = handleFeedEvent;
}

connectFeed();
refreshHistory();
setInterval(refreshHistory, 10000);
</script>
