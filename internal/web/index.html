<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>牛B WAF 管理控制台</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='4.5' y1='2.5' x2='19.5' y2='21.5' gradientUnits='userSpaceOnUse'%3E%3Cstop offset='0' stop-color='%230da6a2'/%3E%3Cstop offset='.5' stop-color='%233d78e3'/%3E%3Cstop offset='1' stop-color='%234e55c7'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath fill='url(%23g)' d='M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z'/%3E%3Cpath fill='%23fff' opacity='.12' d='M12 2l8 3v7c0 6-8 10-8 10z'/%3E%3Cpath fill='%23fff' d='M12.55 6.5 7.05 13.1h4.9l-.5 4.4 5.55-6.6h-5z'/%3E%3C/svg%3E">
</head>
<body>
<div id="login" class="login-wrap hidden">
  <div class="login-shell">
    <div class="login-visual">
      <div class="auth-art" aria-hidden="true"><div class="logo-mark"><svg viewBox="0 0 24 24" fill="none"><defs><linearGradient id="nbG1" x1="4.5" y1="2.5" x2="19.5" y2="21.5" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#0da6a2"/><stop offset=".5" stop-color="#3d78e3"/><stop offset="1" stop-color="#4e55c7"/></linearGradient></defs><path fill="url(#nbG1)" d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path fill="#fff" opacity=".12" d="M12 2l8 3v7c0 6-8 10-8 10z"/><path fill="#fff" d="M12.55 6.5 7.05 13.1h4.9l-.5 4.4 5.55-6.6h-5z"/></svg></div></div>
      <h1>牛B WAF</h1>
      <p>Web 应用防火墙</p>
    </div>
    <section class="login-card" aria-labelledby="login-title">
      <h2 id="login-title" class="login-heading">登录控制台</h2>
      <p class="login-sub">使用控制台账号登录</p>
      <label class="login-label" for="login-user">账号</label>
      <div class="login-field"><input id="login-user" autocomplete="username" value="admin" style="padding-left:14px"></div>
      <label class="login-label" for="login-pass">密码</label>
      <div class="login-field">
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <input id="login-pass" type="password" autocomplete="current-password">
      </div>
      <button id="login-btn" class="btn" onclick="doLogin()">登录</button>
      <div id="login-err" class="err" role="alert"></div>
      <p class="login-tip">初始密码见首次启动日志</p>
    </section>
  </div>
</div>

<div id="force-change" class="login-wrap hidden">
  <section class="login-card single" aria-labelledby="fc-title">
    <div class="logo-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><defs><linearGradient id="nbG2" x1="4.5" y1="2.5" x2="19.5" y2="21.5" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#0da6a2"/><stop offset=".5" stop-color="#3d78e3"/><stop offset="1" stop-color="#4e55c7"/></linearGradient></defs><path fill="url(#nbG2)" d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path fill="#fff" opacity=".12" d="M12 2l8 3v7c0 6-8 10-8 10z"/><path fill="#fff" d="M12.55 6.5 7.05 13.1h4.9l-.5 4.4 5.55-6.6h-5z"/></svg></div>
    <h1 id="fc-title" class="login-heading">修改默认密码</h1>
    <p id="fc-hint" class="login-sub">新密码至少 8 位，需同时包含字母和数字。</p>
    <label class="login-label" for="fc-new">新密码</label>
    <div class="login-field">
      <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      <input id="fc-new" type="password" autocomplete="new-password" aria-describedby="fc-hint">
    </div>
    <label class="login-label" for="fc-confirm">确认新密码</label>
    <div class="login-field">
      <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      <input id="fc-confirm" type="password" autocomplete="new-password">
    </div>
    <button id="fc-btn" class="btn" onclick="doForceChange()">确认修改</button>
    <div id="fc-err" class="err" role="alert"></div>
  </section>
</div>

<div id="app" class="hidden">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo-mark"><svg viewBox="0 0 24 24" fill="none"><defs><linearGradient id="nbG3" x1="4.5" y1="2.5" x2="19.5" y2="21.5" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#0da6a2"/><stop offset=".5" stop-color="#3d78e3"/><stop offset="1" stop-color="#4e55c7"/></linearGradient></defs><path fill="url(#nbG3)" d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path fill="#fff" opacity=".12" d="M12 2l8 3v7c0 6-8 10-8 10z"/><path fill="#fff" d="M12.55 6.5 7.05 13.1h4.9l-.5 4.4 5.55-6.6h-5z"/></svg></div>
      <div class="brand-label"><span class="brand-text">牛B WAF</span><span class="brand-sub">管理控制台</span></div>
    </div>
    <nav aria-label="控制台导航">
      <div class="nav-label">概览</div>
      <a href="#/dashboard" data-view="dashboard" aria-label="仪表盘" title="仪表盘"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg><span>仪表盘</span></a>
      <a href="#/traffic" data-view="traffic" aria-label="流量分析" title="流量分析"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15v3M12 9v9M17 5v13"/></svg><span>流量分析</span></a>
      <a href="#/posture" data-view="posture" aria-label="安全态势" title="安全态势"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></svg><span>安全态势</span></a>
      <a href="screen.html" target="_blank" rel="noopener" aria-label="实时大屏" title="实时大屏"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg><span>实时大屏</span></a>
      <div class="nav-label">防护</div>
      <a href="#/sites" data-view="sites" aria-label="防护站点" title="防护站点"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg><span>防护站点</span></a>
      <a href="#/logs" data-view="logs" aria-label="攻击日志" title="攻击日志"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.46 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4M12 17h.01"/></svg><span>攻击日志</span></a>
      <a href="#/tuning" data-view="tuning" aria-label="规则调优" title="规则调优"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg><span>规则调优</span></a>
      <a href="#/rules" data-view="rules" aria-label="自定义规则" title="自定义规则"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg><span>自定义规则</span></a>
      <a href="#/ips" data-view="ips" aria-label="黑白名单" title="黑白名单"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m4.9 4.9 14.2 14.2"/></svg><span>黑白名单</span></a>
      <a href="#/reputation" data-view="reputation" aria-label="IP 信誉" title="IP 信誉"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M12 8v4M12 16h.01"/></svg><span>IP 信誉</span></a>
      <div class="nav-label">系统</div>
      <a href="#/settings" data-view="settings" aria-label="安全设置" title="安全设置"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg><span>安全设置</span></a>
      <a href="#/operations" data-view="operations" aria-label="运行维护" title="运行维护"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 12h18M7 8h.01M7 16h.01M11 8h6M11 16h6"/></svg><span>运行维护</span></a>
      <a href="#/accounts" data-view="accounts" aria-label="账号管理" title="账号管理"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="7" r="4"/><path d="M2 21v-2a4 4 0 0 1 4-4h6a4 4 0 0 1 4 4v2M16 3a4 4 0 0 1 0 8M22 21v-2a4 4 0 0 0-3-3.87"/></svg><span>账号管理</span></a>
      <a href="#/profile" data-view="profile" aria-label="我的账号" title="我的账号"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a4 4 0 0 1 4-4h8a4 4 0 0 1 4 4v2"/></svg><span>我的账号</span></a>
      <a href="#/audit" data-view="audit" aria-label="审计日志" title="审计日志"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/></svg><span>审计日志</span></a>
    </nav>
    <div class="sidebar-foot">
      <div class="engine-card"><span class="live-dot"></span><span class="engine-text"><b>引擎运行中</b> · Coraza + CRS</span></div>
      <button class="link" onclick="doLogout()" aria-label="退出登录" title="退出登录"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5M21 12H9"/></svg><span>退出登录</span></button>
    </div>
  </aside>
  <main id="main"></main>
</div>

<div id="modal-root"></div>
<div id="toast" role="status"></div>
<script src="echarts.min.js"></script>
<script src="app.js"></script>
</body>
</html>
