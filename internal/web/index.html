<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>牛B WAF 管理控制台</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='4.5' y1='2.5' x2='19.5' y2='21.5' gradientUnits='userSpaceOnUse'%3E%3Cstop offset='0' stop-color='%2322d3ee'/%3E%3Cstop offset='.5' stop-color='%236366f1'/%3E%3Cstop offset='1' stop-color='%23a855f7'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath fill='url(%23g)' d='M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z'/%3E%3Cpath fill='%23fff' opacity='.12' d='M12 2l8 3v7c0 6-8 10-8 10z'/%3E%3Cpath fill='%23fff' d='M12.55 6.5 7.05 13.1h4.9l-.5 4.4 5.55-6.6h-5z'/%3E%3C/svg%3E">
</head>
<body>
<div id="login" class="login-wrap hidden">
  <div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>
  <div class="login-card">
    <div class="logo-mark"><svg viewBox="0 0 24 24" fill="none"><defs><linearGradient id="nbG1" x1="4.5" y1="2.5" x2="19.5" y2="21.5" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#6366f1"/><stop offset="1" stop-color="#a855f7"/></linearGradient></defs><path fill="url(#nbG1)" d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path fill="#fff" opacity=".12" d="M12 2l8 3v7c0 6-8 10-8 10z"/><path fill="#fff" d="M12.55 6.5 7.05 13.1h4.9l-.5 4.4 5.55-6.6h-5z"/></svg></div>
    <div class="login-logo">牛B WAF</div>
    <div class="login-sub">新一代智能 Web 应用防火墙</div>
    <div class="login-badge">PROFESSIONAL EDITION</div>
    <div class="login-field">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      <input id="login-pass" type="password" placeholder="管理密码" autofocus>
    </div>
    <button id="login-btn" onclick="doLogin()">登 录</button>
    <div id="login-err" class="err"></div>
    <div class="login-tip">初始密码 admin123 · 登录后请立即修改</div>
  </div>
</div>

<div id="force-change" class="login-wrap hidden">
  <div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>
  <div class="login-card">
    <div class="logo-mark"><svg viewBox="0 0 24 24" fill="none"><defs><linearGradient id="nbG2" x1="4.5" y1="2.5" x2="19.5" y2="21.5" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#6366f1"/><stop offset="1" stop-color="#a855f7"/></linearGradient></defs><path fill="url(#nbG2)" d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path fill="#fff" opacity=".12" d="M12 2l8 3v7c0 6-8 10-8 10z"/><path fill="#fff" d="M12.55 6.5 7.05 13.1h4.9l-.5 4.4 5.55-6.6h-5z"/></svg></div>
    <div class="login-logo">修改默认密码</div>
    <div class="login-sub">检测到仍在使用默认管理密码，请先设置新密码后再进入控制台</div>
    <div class="login-field">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      <input id="fc-new" type="password" placeholder="新密码（至少 8 位，含字母和数字）" autofocus>
    </div>
    <div class="login-field">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      <input id="fc-confirm" type="password" placeholder="确认新密码">
    </div>
    <button id="fc-btn" onclick="doForceChange()">确认修改</button>
    <div id="fc-err" class="err"></div>
    <div class="login-tip">新密码不能为 admin123，需同时包含字母和数字</div>
  </div>
</div>

<div id="app" class="hidden">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo-mark"><svg viewBox="0 0 24 24" fill="none"><defs><linearGradient id="nbG3" x1="4.5" y1="2.5" x2="19.5" y2="21.5" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#6366f1"/><stop offset="1" stop-color="#a855f7"/></linearGradient></defs><path fill="url(#nbG3)" d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path fill="#fff" opacity=".12" d="M12 2l8 3v7c0 6-8 10-8 10z"/><path fill="#fff" d="M12.55 6.5 7.05 13.1h4.9l-.5 4.4 5.55-6.6h-5z"/></svg></div>
      <span class="brand-text">牛B WAF</span>
    </div>
    <div class="brand-sub">PROFESSIONAL</div>
    <nav>
      <div class="nav-label">概览</div>
      <a href="#/dashboard" data-view="dashboard"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg><span>仪表盘</span></a>
      <a href="#/traffic" data-view="traffic"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15v3M12 9v9M17 5v13"/></svg><span>流量分析</span></a>
      <a href="#/posture" data-view="posture"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></svg><span>安全态势</span></a>
      <a href="screen.html" target="_blank"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg><span>实时大屏</span></a>
      <div class="nav-label">防护</div>
      <a href="#/sites" data-view="sites"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg><span>防护站点</span></a>
      <a href="#/logs" data-view="logs"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.46 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4M12 17h.01"/></svg><span>攻击日志</span></a>
      <a href="#/tuning" data-view="tuning"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg><span>规则调优</span></a>
      <a href="#/rules" data-view="rules"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg><span>自定义规则</span></a>
      <a href="#/ips" data-view="ips"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m4.9 4.9 14.2 14.2"/></svg><span>黑白名单</span></a>
      <a href="#/reputation" data-view="reputation"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M12 8v4M12 16h.01"/></svg><span>IP 信誉</span></a>
      <div class="nav-label">系统</div>
      <a href="#/settings" data-view="settings"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg><span>安全设置</span></a>
      <a href="#/audit" data-view="audit"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/></svg><span>审计日志</span></a>
    </nav>
    <div class="sidebar-foot">
      <div class="engine-card"><span class="live-dot"></span><span class="engine-text"><b>引擎运行中</b> · Coraza + CRS</span></div>
      <button class="link" onclick="doLogout()"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5M21 12H9"/></svg><span>退出登录</span></button>
    </div>
  </aside>
  <main id="main"></main>
</div>

<div id="modal-root"></div>
<div id="toast"></div>
<script src="echarts.min.js"></script>
<script src="app.js"></script>
</body>
</html>
